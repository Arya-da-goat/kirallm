model:
  vocab_size: 32000
  max_seq_len: 2048
  dim: 1024
  n_layers: 16
  n_heads: 16
  n_kv_heads: 4
  ffn_dim: 2816
  dropout: 0.0
  rope_theta: 10000.0
  norm_eps: 0.00001
  tie_embeddings: true
  use_qk_norm: true
training:
  seed: 42
  batch_size: 1
  grad_accumulation: 32
  epochs: 1
  max_steps: -1
  learning_rate: 0.0002
  min_learning_rate: 0.00002
  warmup_steps: 1000
  weight_decay: 0.1
  grad_clip: 1.0
  validation_fraction: 0.01
  eval_every: 500
  eval_batches: 50
  save_every: 1000
  mixed_precision: bf16
  num_workers: 2
  log_every: 10
  checkpoint_dir: checkpoints
  data_file: data/train.txt
  validation_file: data/corpus/val.txt
  tokenizer_dir: tokenizer/model
