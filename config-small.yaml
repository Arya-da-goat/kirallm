model:
  vocab_size: 16000
  max_seq_len: 512
  dim: 384
  n_layers: 6
  n_heads: 6
  n_kv_heads: 2
  ffn_dim: 1024
  dropout: 0.0
  rope_theta: 10000.0
  norm_eps: 0.00001
  tie_embeddings: true
  use_qk_norm: true
training:
  seed: 42
  batch_size: 4
  grad_accumulation: 8
  epochs: 3
  max_steps: -1
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_steps: 200
  weight_decay: 0.1
  grad_clip: 1.0
  validation_fraction: 0.02
  eval_every: 100
  eval_batches: 20
  save_every: 250
  mixed_precision: bf16
  num_workers: 0
  log_every: 10
  checkpoint_dir: checkpoints
  data_file: data/train.txt
  validation_file: data/corpus/val.txt
  tokenizer_dir: tokenizer/model
